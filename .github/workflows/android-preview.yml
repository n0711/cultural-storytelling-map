name: Android preview APK
on:
  pull_request:
    paths: ['mobile/android/**', '.github/workflows/android-preview.yml']
  push:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/android-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p mobile/android :app:assembleDebug --no-daemon
      - name: Export public certificate fingerprint
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | sed -n 's/^[[:space:]]*SHA256: //p' > mobile/android/app/build/outputs/apk/debug/certificate-sha256.txt
          test -s mobile/android/app/build/outputs/apk/debug/certificate-sha256.txt
          cat mobile/android/app/build/outputs/apk/debug/certificate-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: narrify-android-debug
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/debug/certificate-sha256.txt
          if-no-files-found: error
          retention-days: 14
