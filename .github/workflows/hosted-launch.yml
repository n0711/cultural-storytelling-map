name: Hosted launch checks
on:
  pull_request:
    paths: ['hosted/**', '.github/workflows/hosted-launch.yml']
  push:
    branches: [main]
    paths: ['hosted/**', '.github/workflows/hosted-launch.yml']
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: hosted/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: node --test tests/launch.test.mjs
      - run: pnpm run build
